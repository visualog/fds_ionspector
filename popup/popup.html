<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      background: #f8f9fa;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #3182f6;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1c1e;
    }
    .status-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e9ecef;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .status-label {
      color: #717985;
      font-size: 13px;
    }
    .status-value {
      font-weight: 600;
      font-size: 13px;
    }
    .status-active { color: #3182f6; }
    
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #3182f6; }
    input:checked + .slider:before { transform: translateX(16px); }

    .btn-re-scan {
      width: 100%;
      background: #3182f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-re-scan:hover { opacity: 0.9; }
    .btn-re-scan:disabled { background: #e9ecef; color: #adb5bd; cursor: not-allowed; }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #adb5bd;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">F</div>
    <div class="title">FDS Inspector</div>
  </div>
  
  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span id="status" class="status-value">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Highlighting</span>
      <label class="switch">
        <input type="checkbox" id="toggle-highlight" checked>
        <span class="slider"></span>
      </label>
    </div>
    <button class="btn-re-scan" id="scan" disabled>Re-scan Page</button>
  </div>

  <div class="footer">
    Connected to FDS v2.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
