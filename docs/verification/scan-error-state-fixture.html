<!doctype html>
<html lang="ko" data-fds-inspector-force-scan-error="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDS Inspector Error State Fixture</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      color: #252d38;
    }

    main {
      width: min(520px, calc(100vw - 48px));
      padding: 24px;
      border: 1px solid #d1d6db;
      border-radius: 7px;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 8px;
      color: #3182f6;
      font-size: 28px;
    }

    p {
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Error state fixture</h1>
    <p>이 페이지는 localhost 검증에서만 FDS Inspector 검사 오류 UI를 강제로 확인하기 위한 fixture입니다.</p>
  </main>
</body>
</html>
